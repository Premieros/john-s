name: Update auto production work log

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-auto-production-log.yml'

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append work log
        shell: bash
        run: |
          cat >> docs/CURRENT_WORK_PLAN.md <<'EOF'

