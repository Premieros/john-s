name: Apply purchase UOM UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-purchase-uom-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch purchases UI
        shell: bash
        run: |
          echo '' | base64 -d | python3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/trade/pages/PurchasesPage.tsx
          git commit -m "feat: allow raw purchase units independent of stock unit"
          git push
