name: Record branch visibility work

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-log-branch-visibility.yml'

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update current work plan
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_WORK_PLAN.md')
          s = p.read_text(encoding='utf-8')
          marker = '### Branch visibility — Products + Raw Materials ✅'
          if marker not in s:
              s += '''\n\n---\n\n### Branch visibility — Products + Raw Materials ✅\n- تحقق إنتاجي: المنتجات **352/352** لديها `branch_id`، والخامات **215/215** لديها `branch_id`، ولا توجد سجلات بدون فرع.\n- كل بيانات Excel الحالية موجودة على **فرع نادي سموحة** فقط؛ لم يتم نسخها تلقائيًا إلى الفرع الرئيسي.\n- أُنشئ `BranchBadge` موحد في `src/components/BranchBadge.tsx`.\n- `ProductsPage` تعرض الفرع في الجدول وداخل نافذة التعديل.\n- `RawMaterialsPage` تعرض الفرع في الجدول وداخل نافذة الإضافة/التعديل.\n- قائمة الخامات أصبحت تطبق `branchFilter` صراحةً.\n- إنشاء/تعديل الخامة يرسل `branch_id` صراحةً، مع اختيار الفرع للمدير العام وإظهاره ثابتًا للمستخدم المحصور بفرعه.\n- هذه أول شريحة مكتملة من P3؛ بقية الصفحات branch-scoped ما زالت ضمن الخطة.\n'''
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_WORK_PLAN.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: record product and raw material branch visibility"
          git push
