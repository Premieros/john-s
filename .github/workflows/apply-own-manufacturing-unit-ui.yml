name: Apply own manufacturing unit UI fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-own-manufacturing-unit.mjs'
      - '.github/workflows/apply-own-manufacturing-unit-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch ProductsPage
        run: node scripts/patch-own-manufacturing-unit.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/catalog/pages/ProductsPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: show product own manufacturing unit"
          git push
