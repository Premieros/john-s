name: Fix refund approval RPC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-refund-approval-rpc.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SalesPage
        run: python3 .github/scripts/fix_refund_approval_rpc.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/trade/pages/SalesPage.tsx
          git commit -m "fix: use canonical refund approval RPC"
          git push
