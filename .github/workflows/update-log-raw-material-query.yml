name: Record raw material recipe query fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-log-raw-material-query.yml'

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update current work plan
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CURRENT_WORK_PLAN.md')
          s=p.read_text(encoding='utf-8')
          marker='### إصلاح Recipe الوحدات — raw_materials.cost_price ✅'
          if marker not in s:
              s += '''\n\n---\n\n### إصلاح Recipe الوحدات — raw_materials.cost_price ✅\n- تم إصلاح `InventoryUnitsPage` الذي كان يستعلم عن العمود غير الموجود `raw_materials.cost_price`.\n- قائمة الخامات تحتاج فقط `id,name`، لذلك أزيل العمود القديم من الاستعلام ومن نوع الواجهة.\n- لم يتم إنشاء عمود تكلفة ثابت جديد؛ مصدر التكلفة التشغيلي يبقى المشتريات/الدفعات الفعلية وفق معمارية FIFO الحالية.\n- صفحة Recipes العامة لا تعتمد `cost_price` في الاستعلام؛ تستخدم بيانات الخامة الحالية وحسابها التقديري منفصل عن تكلفة FIFO التشغيلية.\n'''
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_WORK_PLAN.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: record raw material recipe query fix"
          git push
