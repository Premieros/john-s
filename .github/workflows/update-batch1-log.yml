## 14) الدفعة المجمعة 1 — الشراء + UOM + التكلفة + التوفر + التصنيع التلقائي ✅

Migration:
`supabase/migrations/20260902020000_purchase_raw_uom_normalization.sql`

تم إغلاق دورة التشغيل التالية:
`Purchase -> canonical raw stock -> actual cost -> product availability -> automatic manufactured production -> sale`.

### وحدات الشراء
- فاتورة الشراء تحفظ الوحدة والكمية والسعر كما أدخلها المستخدم.
- مخزون الخامة يحفظ الكمية في وحدة التخزين الأساسية للخامة.
- مدعوم Server-side: `kg <-> g` و `liter <-> ml`، مع aliases العربية/الإنجليزية.
- الوحدة غير المتوافقة تُرفض بـ `INCOMPATIBLE_PURCHASE_UNIT` بدل تلويث المخزون.
- `_raw_add` يقرأ وحدة سطر `purchase_items` عند مصدر Purchase ويحوّل الكمية والتكلفة قبل إنشاء raw batch/ledger.

### دقة التكلفة
- `raw_material_inventory.avg_cost` أصبح `numeric(18,6)`.
- `raw_material_batches.unit_cost` أصبح `numeric(18,6)`.
- `inventory_ledger.unit_cost` أصبح `numeric(18,6)`.
- `purchase_items.unit_cost` بقي قيمة الفاتورة كما أدخلها المستخدم.

### واجهة المشتريات
- وحدة الشراء أصبحت اختيارًا مستقلًا عن وحدة التخزين.
- خامة مخزنة بالجرام تسمح شراء جرام أو كيلوجرام.
- خامة مخزنة بالمل تسمح شراء مل أو لتر.
- الوحدة المختارة تُرسل في `unit_name` إلى `process_purchase` ولا تُستبدل قسرًا بوحدة التخزين.

### الاختبار
`tests/integration/purchase_uom_auto_sale_cycle.test.ts`
يثبت:
- `1 kg @ 120` يبقى في الفاتورة `1 × 120`.
- المخزون يصبح `1000 g @ 0.120000`.
- منتج يحتاج 150g من مصنع يظهر متاحًا 6 وحدات.
- بيع 2 يصنع النقص manufactured تلقائيًا، يستهلك 300g، ويبقى 700g والمتاح 4.
- لا يوجد خصم مزدوج.

### CI
- النسخة النظيفة: `cf9a13ee3e7ec258a585bb502b343cc0d8577932`.
- Verify main #89: verify ✅ db/integration/security/RLS ✅ browser-smoke ✅.
- Migration + test كانت قد اجتازت أيضًا Verify #87 قبل تعديل UI.

### Production
- Migration `purchase_raw_uom_normalization` طُبقت بنجاح بتاريخ 2026-09-02.
- Smoke read-only على Production:
  - `1 kg @ 120` لخامة مخزنة `جم` => `1000 جم @ 0.12` ✅.
  - `1 liter @ 80` لخامة مخزنة `مل` => `1000 مل @ 0.08` ✅.
  - `liter` لخامة `جم` => `INCOMPATIBLE_PURCHASE_UNIT` ✅.
- لم يتم إنشاء أي فاتورة تجريبية على Production؛ عدد المشتريات قبل وبعد الاختبار بقي 0.
