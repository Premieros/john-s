name: Apply POS ingredient availability v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pos-ingredient-availability-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch POS files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/features/pos/pages/PosWorkspacePage.tsx')
          s = page.read_text(encoding='utf-8')
          start = s.index('  const loadStock = useCallback(async (branchId: string) => {')
          end = s.index('  const pos = usePosOrder({', start)
          replacement = '''  const loadStock = useCallback(async (branchId: string) => {
    if (!branchId) {
      setStockMap({});
      return;
    }
    const { data: warehouses } = await supabase
      .from('warehouses')
      .select('id')
      .eq('branch_id', branchId)
      .eq('is_active', true);
    const warehouseId = ((warehouses || []) as { id: string }[])[0]?.id || null;
    if (!warehouseId) {
      setStockMap({});
      return;
    }
    const { data, error } = await supabase.rpc('get_pos_product_availability', {
      p_branch_id: branchId,
      p_warehouse_id: warehouseId,
      p_cap: 100000,
    });
    if (error) {
      setStockMap({});
      return;
    }
    const map: Record<string, number> = {};
    for (const row of (data || []) as { product_id: string; available_quantity: number | string }[]) {
      map[row.product_id] = Number(row.available_quantity) || 0;
    }
    setStockMap(map);
  }, []);

  const sellableStock = stockMap;

'''
          page.write_text(s[:start] + replacement + s[end:], encoding='utf-8')

          hook = Path('src/features/pos/hooks/usePosOrder.ts')
          s = hook.read_text(encoding='utf-8')
          s = s.replace('Product, ProductComponent, RpcResult', 'Product, RpcResult')
          s = s.replace('  sellableStock: Record<string, number>;\n  recipeMap: Record<string, ProductComponent[]>;\n', '')
          s = s.replace(
              '  const { branchId, orderId, customers, effSettings, isCashier, activeShift, products, stockMap, sellableStock, recipeMap } = input;',
              '  const { branchId, orderId, customers, effSettings, isCashier, activeShift, products, stockMap } = input;'
          )
          gs = s.index('  const getStock = useCallback((productId: string) => {')
          ge = s.index('\n\n  const addToCart = useCallback(', gs)
          s = s[:gs] + "  const getStock = useCallback((productId: string) => stockMap[productId] || 0, [stockMap]);" + s[ge:]
          guard = '''    if (product.product_type === 'manufactured' && (recipeMap[product.id]?.length || 0) === 0) {
      show(`${product.name}: ${t('noRecipe')}`, 'error');
      return;
    }
'''
          s = s.replace(guard, '')
          s = s.replace('if (inCart + quantity > stock && stock > 0)', 'if (inCart + quantity > stock)')
          s = s.replace('}, [getStock, recipeMap, cart, show, t]);', '}, [getStock, cart, show, t]);')
          s = s.replace('if (delta > 0 && stock > 0)', 'if (delta > 0)')
          s = s.replace('if (stock > 0 && qty > stock)', 'if (qty > stock)')
          hook.write_text(s, encoding='utf-8')

          # The hook no longer needs the legacy client-side stock inputs.
          page_text = page.read_text(encoding='utf-8')
          page_text = page_text.replace('    sellableStock,\n    recipeMap,\n', '')
          page.write_text(page_text, encoding='utf-8')
          PY
      - name: Commit POS patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/pos/pages/PosWorkspacePage.tsx src/features/pos/hooks/usePosOrder.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: derive POS availability from ingredients"
          git push
