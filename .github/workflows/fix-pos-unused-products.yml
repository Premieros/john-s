name: Fix POS unused products

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pos-unused-products.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused destructure
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/pos/hooks/usePosOrder.ts')
          s = p.read_text(encoding='utf-8')
          old = '  const { branchId, orderId, customers, effSettings, isCashier, activeShift, products, stockMap } = input;'
          new = '  const { branchId, orderId, customers, effSettings, isCashier, activeShift, stockMap } = input;'
          if old not in s:
              raise SystemExit('destructure anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/pos/hooks/usePosOrder.ts
          git commit -m "fix: remove unused POS product stock dependency"
          git push
