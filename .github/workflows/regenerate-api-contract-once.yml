name: Regenerate API contract once

on:
  push:
    branches:
      - development/frontend-v2

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/frontend-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate API contract
        run: node scripts/db/gen-contract.js
      - name: Commit contract if changed
        run: |
          if git diff --quiet -- supabase/api-contract.json; then
            echo "API contract already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/api-contract.json
          git commit -m "chore: refresh frontend api contract"
          git push origin HEAD:development/frontend-v2
