name: Apply payment approval UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-change-payment-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch SalesPage
        run: python3 .github/scripts/apply_change_payment_ui.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/trade/pages/SalesPage.tsx
          git commit -m "feat: route payment changes through manager approval"
          git push
