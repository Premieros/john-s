name: Record P3 sales shifts branch visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-log-p3-sales-shifts.yml'

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append verified work log
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_WORK_PLAN.md')
          s = p.read_text(encoding='utf-8')
          marker = '### P3 Branch visibility — Sales / Refunds / Shifts ✅'
          if marker not in s:
              s += '''\n\n---\n\n### إصلاح TypeScript لربط الخامات بالفروع ✅\n- أضيف `branch_id: string` إلى نوع `RawMaterial` في `src/lib/domains/types/manufacturing.ts` حتى يطابق مخطط قاعدة البيانات الفعلي واستخدام `RawMaterialsPage`.\n- Commit: `836f128f6eacfdae06f4b353a6b3f9e8cf9b6465`.\n\n### P3 Branch visibility — Sales / Refunds / Shifts ✅\n- تم توسيع `BranchBadge` إلى صفحة المبيعات/الفواتير، وهي نفس الصفحة التي تعرض وتنفذ المرتجعات.\n- استعلام `SalesPage` أصبح يجلب `branch_id` صراحةً، ويعرض اسم الفرع في كل صف.\n- تم تحويل عمود الفرع في `ShiftsPage` إلى `BranchBadge` الموحد بدل النص العادي.\n- Commit التطبيق: `83ea36c99615139cf3f2445f2faa504b3f06043d`.\n- المكتمل في P3 حتى الآن: Products + Raw Materials + Sales/Invoices/Refund rows + Shifts.\n- المتبقي في P3: Purchases/Receiving/Procurement، Inventory/Warehouses/Transfers، Users/Parties، Reports، والطباعة/المستندات التي لا تعرض الفرع بعد.\n'''
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_WORK_PLAN.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: record sales shifts branch visibility"
          git push
