### Refund manager approval — مكتمل ومطبق Production ✅
Migration: `supabase/migrations/20260902033000_refund_manager_approval_gate.sql`.
- المدير/الإدارة بصلاحية `refunds.approve` ينفذ المرتجع مباشرة.
