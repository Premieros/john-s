name: Update current work plan 20260902

on:
  push:
    paths:
      - '.github/workflows/update-current-work-plan-20260902.yml'

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append current status
        run: |
          python -c "import base64,pathlib; p=pathlib.Path('docs/CURRENT_WORK_PLAN.md'); p.write_bytes(p.read_bytes()+base64.b64decode(''))"
          git config user.name "Premier Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/CURRENT_WORK_PLAN.md
          git diff --cached --check
          git commit -m "docs: record KDS approvals and P3 progress"
          git push
