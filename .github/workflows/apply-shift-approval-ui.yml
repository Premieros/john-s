name: Apply shift approval UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-shift-approval-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ShiftModal
        run: python3 .github/scripts/apply_shift_approval_ui.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/pos/components/shift/ShiftModal.tsx
          git commit -m "feat: add approved shift and drawer actions"
          git push
