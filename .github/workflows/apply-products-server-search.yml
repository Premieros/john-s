name: Apply products server search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-products-server-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ProductsPage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/features/catalog/pages/ProductsPage.tsx')
          s = p.read_text()

          marker = "  const branchFilter = useBranchFilter();\n"
          if marker not in s:
              raise SystemExit('branchFilter marker not found')
          if "  const [search, setSearch] = useState('');\n" not in s:
              raise SystemExit('search state not found')
          s = s.replace("  const [search, setSearch] = useState('');\n", '', 1)
          s = s.replace(marker, marker + "  const [search, setSearch] = useState('');\n", 1)

          needle = "    branch_id: branchFilter,\n    pageSize: 100,"
          if needle not in s:
              raise SystemExit('paginated hook options marker not found')
          s = s.replace(
              needle,
              "    branch_id: branchFilter,\n    search: { term: search, columns: ['name', 'name_en', 'barcode', 'sku'] },\n    pageSize: 100,",
              1,
          )

          pattern = re.compile(
              r"  const filtered = products\.filter\(\(p\) =>\n"
              r"    !search \|\| p\.name\.toLowerCase\(\)\.includes\(search\.toLowerCase\(\)\) \|\| p\.barcode\?\.includes\(search\) \|\| p\.sku\?\.includes\(search\)\n"
              r"  \);\n"
          )
          s, count = pattern.subn("  const filtered = products;\n", s, count=1)
          if count != 1:
              raise SystemExit('client filter marker not found')

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/catalog/pages/ProductsPage.tsx
          git commit -m "feat: make product search server-side"
          git push
